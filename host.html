<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#070b24">
<title>Birthday Feud · Host</title>
<style>:root{--navy:#0a1446;--gold:#f7c948;--pink:#ff2d95;--cyan:#26f0ff;--ink:#e8ecff;--mute:#8f99cf;--card:#121a4a;--line:#28327e;--bg:#070b24;--green:#11a866;--red:#c8213f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:84px}
button{font:inherit;font-weight:700;color:#fff;background:#25307e;border:2px solid #4252b8;border-radius:14px;padding:12px 14px;min-height:50px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97);filter:brightness(1.2)}
button.go{background:var(--green);border-color:#3ee09a}
button.red{background:var(--red);border-color:#ff6d86}
button.pink{background:#b0186f;border-color:#ff5fae}
button.cyan{background:#0b6f86;border-color:#26f0ff}
button.ghost{background:transparent}
button.done{opacity:.45}
button.on{outline:3px solid var(--cyan);outline-offset:2px}
button.big{font-size:21px;min-height:64px}
button.huge{font-size:24px;min-height:76px}
button:disabled{opacity:.35}
input,textarea,select{font:inherit;font-size:17px;color:#fff;background:#0b1033;border:2px solid #34408f;border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan)}
input[type=checkbox],input[type=radio]{width:26px;height:26px;accent-color:var(--pink);vertical-align:middle;padding:0}
label{display:block;margin:12px 0 5px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
label.inline{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:16px;color:#fff;font-weight:500}
h2{margin:0 0 8px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.top{position:sticky;top:0;z-index:20;background:rgba(7,11,36,.97);border-bottom:1px solid var(--line);padding:8px 12px 10px;backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:8px}
.bar .grow{flex:1;min-width:0}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid}
.pill.ok{color:#8affc4;border-color:#2fd38f}.pill.bad{color:#ffb3c0;border-color:#ff4d6d}.pill.wait{color:#ffe27a;border-color:#b8860b}
.where{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.sc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.sc.t0{border-color:#b0186f}.sc.t1{border-color:#0b6f86}
.sc .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sc{min-width:0}.sc .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sc b{font-size:30px;color:#ffe27a;min-width:64px}
.sc button{min-height:40px;padding:4px 9px;font-size:15px;border-radius:10px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
main{padding:12px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.coach{background:#1d1350;border:2px solid #7a3cff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:17px}
.coach b{color:#ffd1ea}
.q{font-size:21px;font-weight:800;margin-bottom:10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.answers button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:62px;font-size:18px;background:#1f2b8a}
.answers button em{font-style:normal;color:#ffe27a;font-size:20px}
.answers button.done{opacity:1;background:#5b4a0a;border-color:#b8860b;color:#ffe9a8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mt{margin-top:10px}
.mute{color:var(--mute);font-size:14px}
.strikes{display:flex;gap:6px;justify-content:center;margin:4px 0}
.strikes i{font-style:normal;font-weight:900;font-size:26px;width:44px;height:44px;border-radius:10px;border:2px solid #3a2050;display:flex;align-items:center;justify-content:center;color:#3a2050}
.strikes i.on{color:#ff4d6d;border-color:#ff4d6d;background:#3d0812}
.choices button{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:19px;min-height:60px}
.choices button.correct{box-shadow:inset 6px 0 0 #3ee09a}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:44px;padding:6px 12px;font-size:16px}
.qchips button{min-width:56px}
.fmrow{border-top:1px solid var(--line);padding:10px 0}
.fmrow:first-child{border-top:0}
.fmq{font-weight:800;margin-bottom:6px}
.fmin{display:grid;grid-template-columns:1fr 90px 120px;gap:6px;margin-bottom:6px}
.timer{font-size:56px;font-weight:900;color:var(--cyan);text-align:center;line-height:1}
.timer.low{color:#ff6d86}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b1036;border-top:1px solid var(--line)}
.tabs button{min-height:56px;background:transparent;border-color:transparent;font-size:16px}
.tabs button.on{background:#25307e;border-color:#4252b8;outline:none}
.list .it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#0d1440;border:2px solid transparent;margin-bottom:6px}
.list .it.sel{border-color:var(--cyan)}
.list .it .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:6px 0}
.list .it button{min-height:40px;padding:4px 10px}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:1px;margin-right:6px;text-transform:uppercase}
.tag.Feud{background:#2240c0}.tag.Birthday{background:var(--pink)}.tag.Lightning{background:#8a2be2}.tag.Trivia{background:#0b8a55}.tag.Fast{background:#b8860b}
.ans-ed{display:grid;grid-template-columns:30px 1fr 84px 48px;gap:6px;align-items:center;margin-bottom:6px}
.ans-ed span{font-weight:900;color:var(--gold);text-align:center}
.ans-ed button,.ch-ed button{min-height:44px;padding:0}
.ch-ed{display:grid;grid-template-columns:28px 34px 1fr;gap:6px;align-items:center;margin-top:6px}
.ch-ed span{font-weight:900;color:var(--pink)}
.fmt{font:14px/1.4 Menlo,Consolas,monospace;color:#9aa4d8;white-space:pre-wrap;background:#0b1033;padding:10px;border-radius:8px;border:1px dashed #34408f}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);opacity:0;z-index:50;background:#141c56;border:2px solid var(--cyan);padding:10px 18px;border-radius:14px;font-weight:700;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{max-width:420px;margin:12vh auto 0;padding:24px;text-align:center}
.login h1{margin:0;font:900 40px "Arial Black",Arial,sans-serif;color:var(--gold)}
.login p{color:#ffd1ea;font-weight:700}
.login input{font-size:32px;text-align:center;letter-spacing:10px;margin:20px 0 12px}
.namebox input{font-size:26px;font-weight:800;padding:14px}
.warnbar{background:#5a0b2e;color:#ffd1ea;padding:8px 12px;border-radius:10px;margin-top:8px;font-size:14px;font-weight:700}
@media (min-width:900px){ .split{display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start} }
@media (max-width:520px){ .answers{grid-template-columns:1fr} .fmin{grid-template-columns:1fr 70px} .fmin button{grid-column:span 2} }
</style></head>

var SAVING=false, PENDING=false, MYREV=-1, SEENREV=-1, CONN='wait';
function queueSave(){ PENDING=true; if(!SAVING) flush(); }
function flush(){
  if(!PENDING) return; PENDING=false; SAVING=true;
  var c=DIRTY_CONTENT?DATA:null; DIRTY_CONTENT=false;
  sbClient().rpc('feud_save',{p_id:CONFIG.game,p_pin:PIN,p_content:c,p_live:LIVE}).then(function(res){
    SAVING=false;
    if(res.error){
      if(c) DIRTY_CONTENT=true; PENDING=true;
      if(/bad pin/i.test(res.error.message||'')){ logout('That PIN no longer works — please log in again.'); return; }
      setConn('bad'); setTimeout(flush,1500); return;
    }
    MYREV=SEENREV=Math.max(SEENREV,res.data); setConn('ok'); flush();
  },function(){ SAVING=false; if(c) DIRTY_CONTENT=true; PENDING=true; setConn('bad'); setTimeout(flush,2000); });
}

function kindTag(r){var k=roundKind(r); return '<span class="tag '+k.split(' ')[0]+'">'+k+'</span>';}
function whereText(){

function render(){
  if(!DATA){ return; }
  var focus=document.activeElement, fkey=focus&&focus.getAttribute&&focus.getAttribute('data-k'), ss=null,se=null;
  try{ if(fkey){ss=focus.selectionStart;se=focus.selectionEnd;} }catch(e){}
  var y=window.scrollY;
  var h='<div class="top"><div class="bar"><span id="connPill" class="pill '+CONN+'">'+(CONN==='ok'?'● TV synced':CONN==='bad'?'● Offline — retrying':'● Connecting')+'</span>'+
    '<span class="where grow">'+esc(whereText())+'</span><button data-a="undo">↶ Undo</button></div>'+
    '<div class="scores">'+[0,1].map(function(t){return '<div class="sc t'+t+'"><div class="nm">'+esc(tn(t))+'</div><div class="row"><b>'+LIVE.scores[t]+'</b>'+
      '<button data-a="sc:'+t+':-10">−10</button><button data-a="sc:'+t+':-1">−1</button><button data-a="sc:'+t+':1">+1</button><button data-a="sc:'+t+':10">+10</button></div></div>';}).join('')+'</div>'+
    '<div class="nav"><button class="big" data-a="prev">◀ Back</button><button class="big go" data-a="next">'+nextLabel()+'</button></div></div>';
  h+='<main>'+(TAB==='play'?playTab():TAB==='teams'?teamsTab():TAB==='edit'?editTab():moreTab())+'</main>';
  h+='<nav class="tabs">'+[['play','🎮 Play'],['teams','👥 Teams'],['edit','✎ Edit'],['more','⚙ More']].map(function(x){return '<button data-a="tab:'+x[0]+'" class="'+(TAB===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</nav>';
  APP.innerHTML=h;

function nextLabel(){

  var r=round(), n=roundsOf(DATA,LIVE).length;

      '<label>Small note on screen</label>'+F(P+'source',r.source||'',{ph:'e.g. Points estimated by the host'})+
      '<label>Answers, top answer first (total '+tot+')</label>'+r.answers.map(function(a,j){return '<div class="ans-ed"><span>'+(j+1)+'</span>'+F(P+'answers.'+j+'.text',a.text)+F(P+'answers.'+j+'.points',a.points,{num:1})+'<button class="red" data-a="ansdel:'+i+':'+j+'">✕</button></div>';}).join('')+
      '<div class="chips">'+(r.answers.length<8?'<button data-a="ansadd:'+i+'">+ Answer</button>':'')+'<button data-a="anssort:'+i+'">Sort by points</button></div>';
  } else if(r.type==='trivia'){
    h+=r.questions.map(function(q,j){var Q=P+'questions.'+j+'.';
      return '<div class="card" style="background:#0d1440"><div class="bar"><b class="grow" style="color:#ffe27a">Question '+(j+1)+'</b><span style="width:90px">'+F(Q+'points',num(q.points,10),{num:1})+'</span><button class="red" data-a="tqdel:'+i+':'+j+'">✕</button></div>'+
        '<textarea rows="2" class="mt" data-k="'+Q+'q" data-f="r:'+Q+'q">'+esc(q.q)+'</textarea>'+
        [0,1,2,3].map(function(k){return '<div class="ch-ed"><span>'+'ABCD'[k]+'</span><input type="radio" name="c'+i+'_'+j+'" data-f="rc:'+Q+'correct:'+k+'"'+(q.correct===k?' checked':'')+'>'+F(Q+'choices.'+k,q.choices[k]||'')+'</div>';}).join('')+
        '<p class="mute">Tap the circle next to the correct answer.</p></div>';}).join('')+
      '<button data-a="tqadd:'+i+'">+ Question</button>'+
      '<label>Quick paste</label><div class="fmt">Who was born in 1986?\nA) Lady Gaga\nB) Madonna\nC) Cher\nD) Prince\nAnswer: A</div><textarea id="bulk" rows="6" class="mt" placeholder="Paste questions here (blank line between them)"></textarea>'+
      '<div class="grid2 mt"><button data-a="bulk:'+i+':add">Add to end</button><button data-a="bulk:'+i+':replace">Replace all</button></div>';
  } else {
    h+='<p class="mute">Five questions. One answer per line: <b>answer | points</b></p>'+[0,1,2,3,4].map(function(j){var q=r.questions[j]||{q:'',answers:[]}, Q=P+'questions.'+j+'.';
      return '<label>Question '+(j+1)+'</label>'+F(Q+'q',q.q)+'<textarea rows="5" class="mt" data-k="'+Q+'answers" data-f="rl:'+Q+'answers">'+esc((q.answers||[]).map(function(a){return a.text+' | '+num(a.points);}).join('\n'))+'</textarea>';}).join('');
  }
  return h+'</div>';
}
function setPath(o,path,v){var ps=path.split('.'); for(var i=0;i<ps.length-1;i++){var k=ps[i]; if(o[k]==null) o[k]=/^\d+$/.test(ps[i+1])?[]:{}; o=o[k];} o[ps[ps.length-1]]=v;}
function parseLines(txt){return String(txt||'').split(/\r?\n/).map(function(l){l=l.trim(); if(!l) return null; var m=/^(.*?)[\s|,:–-]*(\d+)\s*$/.exec(l); if(m&&m[1].trim()) return {text:m[1].trim(),points:+m[2]}; return {text:l,points:0};}).filter(Boolean);}
function parseTrivia(txt){
  var out=[]; String(txt||'').replace(/\r/g,'').split(/\n\s*\n/).forEach(function(b){
    var lines=b.split('\n').map(function(x){return x.trim();}).filter(Boolean); if(!lines.length) return;
    var q={q:'',choices:['','','',''],correct:0,points:10}, qs=[];
    lines.forEach(function(l){var m;
      if((m=/^([A-Da-d])[\).:\]]\s*(.+)$/.exec(l))) q.choices['abcd'.indexOf(m[1].toLowerCase())]=m[2].trim();
      else if((m=/^(?:answer|correct|ans)\s*[:=-]\s*([A-Da-d])\b/i.exec(l))) q.correct='abcd'.indexOf(m[1].toLowerCase());
      else if((m=/^points?\s*[:=-]\s*(\d+)/i.exec(l))) q.points=+m[1];
      else qs.push(l.replace(/^(?:q\d*|\d+)[\).:]\s*/i,''));
    });
    q.q=qs.join(' '); if(q.q) out.push(q);
  });
  return out;
}
function blankRound(t){
  if(t==='trivia') return {type:'trivia',title:'1986 Trivia',questions:[{q:'New question',choices:['','','',''],correct:0,points:10}]};
  if(t==='fastmoney') return {type:'fastmoney',title:'Fast Money',questions:[0,1,2,3,4].map(function(){return {q:'',answers:[]};})};
  var r={type:'feud',title:'New Round',multiplier:1,source:'Points estimated by the host — no survey was taken',question:'New survey question',answers:[{text:'Answer 1',points:40},{text:'Answer 2',points:30},{text:'Answer 3',points:20}]};
  if(t==='bday'){r.birthday=true; r.title='Birthday Girl Round'; r.multiplier=2; r.source='Answers ranked by Paola herself';}
  if(t==='light'){r.birthday=true; r.lightning=true; r.prize=25; r.title='Lightning Round';}
  return r;
}
function clearRS(gi,ri){ if(gi===LIVE.game) delete LIVE.rs[gi+':'+ri]; }
function shiftRS(gi,from,by){ var o={}; Object.keys(LIVE.rs).forEach(function(k){var p=k.split(':'), g=+p[0], n=+p[1]; if(g===gi&&n>=from) o[g+':'+(n+by)]=LIVE.rs[k]; else o[k]=LIVE.rs[k];}); LIVE.rs=o; }
function edAct(n,x,y){
  var g=DATA.games[EDGAME], G=EDGAME, i=+x, j=+y;
  switch(n){
    case 'edgame': EDGAME=+x; EDSEL=null; render(); return;
    case 'addgame': commit(function(){DATA.games.push({name:'Game '+(DATA.games.length+1),rounds:[]});},{content:true}); EDGAME=DATA.games.length-1; EDSEL=null; render(); return;
    case 'delgame': if(!armed('delgame')) return; if(G===LIVE.game){toast('Can’t delete the set that’s live — switch sets first');return;}
      commit(function(){DATA.games.splice(G,1); if(LIVE.game>G) LIVE.game--; LIVE.rs={};},{content:true}); EDGAME=LIVE.game; EDSEL=null; render(); return;
    case 'edsel': EDSEL=i; render(); return;
    case 'add': commit(function(){g.rounds.push(blankRound(x));},{content:true}); EDSEL=g.rounds.length-1; render(); return;
    case 'edup': case 'eddown': var k=n==='edup'?i-1:i+1; if(k<0||k>=g.rounds.length) return;
      commit(function(){var t=g.rounds[i]; g.rounds[i]=g.rounds[k]; g.rounds[k]=t; if(G===LIVE.game){var a=LIVE.rs[G+':'+i], b=LIVE.rs[G+':'+k]; delete LIVE.rs[G+':'+i]; delete LIVE.rs[G+':'+k]; if(b)LIVE.rs[G+':'+i]=b; if(a)LIVE.rs[G+':'+k]=a; if(LIVE.idx===i)LIVE.idx=k; else if(LIVE.idx===k)LIVE.idx=i;}},{content:true}); EDSEL=k; render(); return;
    case 'eddup': commit(function(){g.rounds.splice(i+1,0,clone(g.rounds[i])); if(G===LIVE.game){shiftRS(G,i+1,1); if(LIVE.idx>i) LIVE.idx++;}},{content:true}); EDSEL=i+1; render(); return;
    case 'eddel': if(!armed('del'+i)) return;
      commit(function(){g.rounds.splice(i,1); if(G===LIVE.game){delete LIVE.rs[G+':'+i]; shiftRS(G,i+1,-1); if(LIVE.idx>i) LIVE.idx--; if(LIVE.idx>=g.rounds.length) LIVE.idx=Math.max(0,g.rounds.length-1); if(!g.rounds.length&&LIVE.screen==='round') LIVE.screen='title';}},{content:true}); EDSEL=null; render(); return;
    case 'ansadd': commit(function(){g.rounds[i].answers.push({text:'',points:0});},{content:true}); return;
    case 'ansdel': commit(function(){g.rounds[i].answers.splice(j,1); clearRS(G,i);},{content:true}); return;
    case 'anssort': commit(function(){g.rounds[i].answers.sort(function(a,b){return num(b.points)-num(a.points);});},{content:true}); return;
    case 'tqadd': commit(function(){g.rounds[i].questions.push({q:'',choices:['','','',''],correct:0,points:10});},{content:true}); return;
    case 'tqdel': commit(function(){g.rounds[i].questions.splice(j,1); clearRS(G,i);},{content:true}); return;
    case 'bulk': var Q=parseTrivia(($('#bulk')||{}).value); if(!Q.length){toast('Couldn’t read any questions — check the format');return;}
      commit(function(){ g.rounds[i].questions = y==='replace'?Q:g.rounds[i].questions.concat(Q); clearRS(G,i);},{content:true}); toast(Q.length+' questions added'); return;
  }
}
function edField(el){
  var f=el.getAttribute('data-f'), p=f.split(':'), kind=p[0], path=p[1], g=DATA.games[EDGAME];
  if(kind==='g'){ commit(function(){g.name=el.value;},{content:true}); return; }
  var ri=+path.split('.')[0], sub=path.split('.').slice(1).join('.'), r=g.rounds[ri];
  var v = kind==='rb'?el.checked : kind==='rn'?num(el.value) : kind==='rc'?+p[2] : kind==='rl'?parseLines(el.value) : (el.getAttribute('data-num')?num(el.value):el.value);
  commit(function(){ setPath(r,sub,v); if(/answers|questions|lightning/.test(sub)) clearRS(EDGAME,ri); },{content:true});
}

/* ---------- answer key / backup ---------- */
function answerKey(){
  var w=window.open('','_blank'); if(!w){toast('Pop-up blocked');return;}
  var h='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Answer key</title><style>body{font:15px -apple-system,Segoe UI,Arial;margin:20px;color:#111}h2{margin:22px 0 6px;border-bottom:2px solid #333}h3{margin:14px 0 4px}.c{font-weight:700;color:#0a7a3a}.m{color:#666;font-size:13px}</style></head><body><h1>'+esc(DATA.showTitle)+' — answer key</h1>';
  DATA.games.forEach(function(g){ h+='<h2>'+esc(g.name)+'</h2>'; g.rounds.forEach(function(r,i){
    h+='<h3>'+(i+1)+'. '+esc(r.title)+' <span class="m">('+roundKind(r)+')</span></h3>';
    if(r.type==='feud') h+='<b>'+esc(r.question)+'</b><ol>'+r.answers.map(function(a){return '<li>'+esc(a.text)+' — '+num(a.points)+'</li>';}).join('')+'</ol>';
    else if(r.type==='trivia') h+='<ol>'+r.questions.map(function(q){return '<li>'+esc(q.q)+' — <span class="c">'+esc(q.choices[q.correct]||'')+'</span></li>';}).join('')+'</ol>';
    else h+='<ol>'+r.questions.map(function(q){return '<li><b>'+esc(q.q)+'</b>: '+(q.answers||[]).map(function(a){return esc(a.text)+' ('+num(a.points)+')';}).join(', ')+'</li>';}).join('')+'</ol>';
  }); });
  w.document.open(); w.document.write(h+'</body></html>'); w.document.close();
}
function exportJSON(){
  var b=new Blob([JSON.stringify({data:DATA,live:LIVE},null,2)],{type:'application/json'}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download='birthday-feud-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);
}
function importJSON(file){
  var rd=new FileReader(); rd.onload=function(){
    try{ var o=JSON.parse(rd.result), d=o.data||o; var n=normalize(clone(d), o.live||freshLive()); commit(function(){DATA=n.D; LIVE=n.L;},{content:true}); toast('Backup imported'); }
    catch(e){ toast('That file isn’t a game backup'); }
  }; rd.readAsText(file);
}

/* ---------- events ---------- */
APP.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var p=b.getAttribute('data-a').split(':'), n=p[0], x=p[1], y=p[2], z=p[3];
  switch(n){
    case 'tab': TAB=x; RESET_ARM=null; render(); window.scrollTo(0,0); return;
    case 'undo': undo(); return;
    case 'next': if(LIVE.screen==='winner'){toast('Game over — start a rematch below');return;} next(); return;
    case 'prev': prev(); return;
    case 'sc': commit(function(){LIVE.scores[+x]+=(+y);}); return;
    case 'rev': feudReveal(+x); return; case 'strike': strike(); return; case 'ctrl': giveControl(+x); return;
    case 'steal': stealResult(x==='1'); return; case 'award': awardManual(+x); return; case 'revall': revealAll(); return; case 'rreset': restartRound(); return;
    case 'pick': triviaPick(+x); return; case 'show': triviaShow(); return; case 'taward': triviaAward(+x); return; case 'tq': triviaGo(+x); return;
    case 'fmtimer': timerToggle(); return; case 'fmtreset': timerReset(); return; case 'fmp': fmPlayer(+x); return; case 'fmhide': fmHide(); return;
    case 'fmdup': commit(function(){fx('sfx','dup');}); return;
    case 'fmteam': commit(function(){rs().team=+x;}); return;
    case 'fmrev': fmReveal(+x,+y); return; case 'fmadd': fmAdd(+x); return;
    case 'fmpick': var q=round().questions[+y]||{answers:[]}; if(z==='x') fmSet(+x,+y,null,0); else {var m=q.answers[+z]; if(m) fmSet(+x,+y,m.text,num(m.points));} return;
    case 'clearnames': commit(function(){DATA.teams[0].name=''; DATA.teams[1].name='';},{content:true}); return;
    case 'defaultnames': commit(function(){DATA.teams[0].name='YASA'; DATA.teams[1].name='Come On Somebody';},{content:true}); return;
    case 'startgame': startGame(+x, true); return;
    case 'reset': resetGame(); return;
    case 'sound': commit(function(){DATA.sound=!DATA.sound;},{content:true}); return;
    case 'key': answerKey(); return; case 'export': exportJSON(); return; case 'import': $('#importFile').click(); return;
    case 'restore': if(!armed('restore')) return; commit(function(){ var t=[DATA.teams[0].name,DATA.teams[1].name]; DATA=normalize(clone(DEFAULT_DATA)).D; DATA.teams[0].name=t[0]; DATA.teams[1].name=t[1]; var n=normalize(DATA,LIVE); LIVE=n.L; },{content:true}); toast('Original questions restored'); return;
    case 'setpin': var np=$('#newPin').value.trim(); if(np.length<4){toast('PIN needs at least 4 characters');return;}
      sbClient().rpc('feud_set_pin',{p_id:CONFIG.game,p_old:PIN,p_new:np}).then(function(r){ if(r.error||!r.data){toast('Couldn’t change the PIN');return;} PIN=np; try{localStorage.setItem(LSK+':pin',PIN);}catch(e){} toast('PIN changed'); }); return;
    case 'logout': logout(''); return;
    default: edAct(n,x,y);
  }
});
APP.addEventListener('input',function(e){
  var el=e.target, f=el.getAttribute&&el.getAttribute('data-f'); if(!f) return;
  if(f.indexOf('team:')===0) typeName(+f.split(':')[1], el.value);
});
APP.addEventListener('change',function(e){
  var el=e.target; if(el.id==='importFile'){ if(el.files[0]) importJSON(el.files[0]); return; }
  var f=el.getAttribute&&el.getAttribute('data-f'); if(!f) return;
  var p=f.split(':');
  if(p[0]==='team') return;
  if(p[0]==='jump'){ if(el.value!=='') goTo(el.value); return; }
  if(p[0]==='d'){ commit(function(){DATA[p[1]]=el.value;},{content:true}); return; }
  if(p[0]==='n'){ commit(function(){setPath(DATA,p[1],num(el.value));},{content:true}); return; }
  if(p[0]==='fmt'){ fmSet(+p[1],+p[2],el.value,null); return; }
  if(p[0]==='fmp'){ fmSet(+p[1],+p[2],null,el.value===''?'':num(el.value)); return; }
  edField(el);
});
APP.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='password') e.target.blur(); });

/* ---------- login & boot ---------- */
function logout(msg){ PIN=null; try{localStorage.removeItem(LSK+':pin');}catch(e){} DATA=null; showLogin(msg); }
function showLogin(msg){
  APP.innerHTML='<div class="login"><h1>BIRTHDAY FEUD</h1><p>Host controls</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><button class="go huge" style="width:100%" id="go">Enter</button><div class="mute" id="lmsg" style="margin-top:12px">'+esc(msg||'')+'</div></div>';
  var go=function(){ tryLogin($('#pin').value.trim()); };
  $('#go').onclick=go; $('#pin').onkeydown=function(e){if(e.key==='Enter')go();}; $('#pin').focus();
}
function tryLogin(pin){
  if(!pin) return; var m=$('#lmsg'); if(m) m.textContent='Checking…';
  var sb=sbClient(); if(!sb){ if(m) m.textContent='Couldn’t load — check the internet connection.'; return; }
  sb.rpc('feud_check_pin',{p_id:CONFIG.game,p_pin:pin}).then(function(r){
    if(r.error){ if(m) m.textContent='Can’t reach the game server. Check Wi-Fi and try again.'; return; }
    if(!r.data){ if(m) m.textContent='Wrong PIN.'; return; }
    PIN=pin; try{localStorage.setItem(LSK+':pin',pin);}catch(e){}
    load();
  },function(){ if(m) m.textContent='Can’t reach the game server. Check Wi-Fi and try again.'; });
}
function load(){
  sbClient().from('feud_games').select('content,live,rev').eq('id',CONFIG.game).maybeSingle().then(function(r){
    if(r.error||!r.data){ showLogin('Couldn’t load the game. Try again.'); return; }
    SEENREV=r.data.rev;
    var fresh=!r.data.content;
    var n=normalize(fresh?clone(DEFAULT_DATA):r.data.content, r.data.live||freshLive());
    DATA=n.D; LIVE=n.L; UNDO=[];
    if(fresh){ DIRTY_CONTENT=true; queueSave(); } else setConn('ok');
    render(); listen(); wake();
  });
}
var WL=null;
function wake(){ try{ if(navigator.wakeLock&&!WL) navigator.wakeLock.request('screen').then(function(l){WL=l; l.addEventListener('release',function(){WL=null;});}).catch(function(){}); }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&PIN){ wake(); } });
(function boot(){
  var saved=null; try{saved=localStorage.getItem(LSK+':pin');}catch(e){}
  if(saved){ PIN=saved; APP.innerHTML='<div class="login"><h1>BIRTHDAY FEUD</h1><p>Connecting…</p></div>'; tryLoginSilent(saved); } else showLogin('');
  function tryLoginSilent(p){ var sb=sbClient(); if(!sb){showLogin('Couldn’t load — check the internet connection.');return;}
    sb.rpc('feud_check_pin',{p_id:CONFIG.game,p_pin:p}).then(function(r){ if(!r.error&&r.data) load(); else showLogin(r.error?'Can’t reach the game server. Check Wi-Fi.':''); },function(){showLogin('Can’t reach the game server. Check Wi-Fi.');}); }
})();
</script></body></html>
